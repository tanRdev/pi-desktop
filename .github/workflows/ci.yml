name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Contract coverage
        run: bun run lint:contracts

      - name: Import boundaries
        run: bun run lint:imports

      - name: File size budget
        run: bun run lint:sizes

      - name: Typecheck
        run: bun run typecheck

      - name: Unit and integration tests
        run: bun run test

      - name: Build desktop
        run: bun run --filter @pi-desktop/desktop build
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Inspect Vite JavaScript graph
        run: bun ./scripts/inspect-packaged-js.mjs apps/desktop/out

      - name: Assert isolated main-process layout
        run: bun ./scripts/assert-main-build-layout.mjs apps/desktop/out/main

      - name: Pack unsigned macOS dir and inspect asar
        run: bun run --filter @pi-desktop/desktop pack:mac:dir
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
